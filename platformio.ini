[env:k10]
build_src_filter = +<*> -<probe/>
platform = https://github.com/DFRobot/platform-unihiker.git
board = unihiker_k10
framework = arduino

board_build.partitions = partitions_doom.csv

monitor_speed = 115200
monitor_port = /dev/cu.usbmodem1101
upload_port = /dev/cu.usbmodem1101

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DModel=None
    ; Optional I2C game controller: set to 0 to omit controller support.
    -DK10_GAME_CONTROLLER=1
    ; Doom's resolution. These MUST be global: doomgeneric.h defaults to
    ; 640x400, so defining them only for the library leaves the backend
    ; compiling against the wrong stride.
    -DDOOMGENERIC_RESX=320
    -DDOOMGENERIC_RESY=200
    ; Same reasoning: i_sound.h only declares DG_sound_module/DG_music_module
    ; (implemented in k10_sound.cpp) when FEATURE_SOUND is visible, and that
    ; header is pulled in from multiple translation units.
    -DFEATURE_SOUND=1
    ; TFT_eSPI config supplied here rather than via the framework package's
    ; shared User_Setup.h (User_Setup_Select.h honours USER_SETUP_LOADED).
    ; Same pins as the vendor default, but 80 MHz instead of 40 -- the blit is
    ; pure SPI time, so this halves it.
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_MISO=-1
    -DTFT_MOSI=21
    -DTFT_SCLK=12
    -DTFT_CS=14
    -DTFT_DC=13
    -DTFT_RST=-1
    -DTOUCH_CS=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=80000000
    -DSPI_READ_FREQUENCY=20000000

; Diagnostic env: SD card probe only, with full ESP-IDF logging.
;   pio run -e sdprobe -t upload
[env:sdprobe]
extends = env:k10
build_src_filter = +<probe/> -<*.cpp>
build_flags =
    ${env:k10.build_flags}
    -DCORE_DEBUG_LEVEL=5
